[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhttpd"
description = "A from-scratch HTTP/1.1 server in pure Python with zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = []

[project.scripts]
pyhttpd = "pyhttpd.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "requests>=2.34,<3",
    "black>=26.5,<27",
    "isort>=8.0,<9",
    "pylint>=4.0,<5",
    "mypy>=2.1,<3",
    "ruff>=0.15.20,<0.16",
    "pip-audit>=2.7",
    "pyyaml>=6,<7",
    "openapi-spec-validator>=0.9,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pyhttpd.__version__" }

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["pyhttpd"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyhttpd.domain.*", "pyhttpd.application.*"]
disallow_untyped_defs = true
warn_return_any = true

[tool.pylint.design]
# Ports-and-adapters: byte-exact response builders and composition wiring take
# several collaborators; 5 is too low for this codebase.
max-args = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
# Protocol ports, frozen value objects, and sentinel classes legitimately expose
# fewer than two public methods.
disable = ["too-few-public-methods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not performance'"
markers = [
  "integration: requires live server",
  "performance: long-running load or stress scenarios",
]
