services:
  pyhttpd:
    build:
      context: .
      dockerfile: Dockerfile
    image: pyhttpd:0.1.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/srv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
