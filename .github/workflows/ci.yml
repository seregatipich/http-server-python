name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: black
        run: black --check src tests

      - name: isort
        run: isort --check-only src tests

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy

      - name: pylint
        run: pylint src/pyhttpd

      - name: pytest
        run: pytest -q

      - name: pip-audit (runtime dependency closure)
        run: pip-audit --progress-spinner=off .

  docker:
    name: Docker build
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pyhttpd:ci .
