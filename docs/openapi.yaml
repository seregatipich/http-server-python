openapi: 3.1.0
info:
  title: pyhttpd
  version: 0.1.0
  summary: A from-scratch HTTP/1.1 server in pure Python with zero runtime dependencies.
  description: |
    `pyhttpd` is a threaded HTTP/1.1 server implemented from raw sockets using only the
    Python standard library. It exposes a small, purpose-built route table covering an
    index document, an echo endpoint, a User-Agent reflector, a health probe, a static
    file CRUD surface, and an optional Prometheus metrics endpoint.

    Cross-cutting behaviors documented in this specification:

    - **Security headers**: every response (including error responses) carries
      `Strict-Transport-Security: max-age=63072000; includeSubDomains`,
      `Content-Security-Policy: default-src 'self'`, and `X-Content-Type-Options: nosniff`.
    - **HEAD support**: any route that serves `GET` also answers `HEAD`. The server
      processes the request as a `GET`, then strips the body while preserving the
      response headers and `Content-Length`.
    - **Gzip negotiation**: text responses (`/echo/{message}`, `/user-agent`) and,
      when `--file-gzip` is enabled, eligible static files compress automatically when
      the request advertises `Accept-Encoding: gzip` with a non-zero quality factor.
    - **Authentication (opt-in)**: disabled by default (`--auth-mode none`). When
      `--auth-mode api-key` or `--auth-mode jwt` is set, every route except
      `GET /healthz` (and CORS preflight) requires credentials and answers `401` with a
      `WWW-Authenticate` challenge when they are missing or invalid. Role-based access
      control additionally gates `GET /files/*` behind the `files:read` scope and
      `POST /files/*` behind the `files:write` scope, returning `403` when the scope is
      absent.
    - **CORS**: when configured via the `--cors-*` flags, preflight `OPTIONS` requests
      that carry `Access-Control-Request-Method` are answered with `204` and the
      negotiated `Access-Control-*` headers; matching simple requests echo the allowed
      origin and expose headers.
    - **Rate limiting & connection limits**: when enabled, throttled requests receive
      `429 Too Many Requests` with `RateLimit-*` and `Retry-After` headers, and requests
      refused by connection caps receive `503 Service Unavailable`.

    Run the server with the `pyhttpd` console script or `python -m pyhttpd`. The default
    bind is `localhost:4221`; passing `--cert` and `--key` enables TLS 1.3 termination.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: pyhttpd
    url: https://github.com/seregatipich/http-server-python

servers:
  - url: http://localhost:4221
    description: Default plaintext bind (host defaults to localhost, port to 4221).
  - url: https://localhost:4221
    description: TLS 1.3 termination, enabled by passing --cert and --key.
  - url: http://{host}:{port}
    description: Custom bind configured with --host and --port.
    variables:
      host:
        default: localhost
      port:
        default: "4221"

tags:
  - name: core
    description: Index, echo, and request-inspection routes.
  - name: health
    description: Liveness and readiness probing.
  - name: files
    description: Sandboxed static file CRUD under the configured --directory.
  - name: observability
    description: Prometheus metrics exposition (requires --metrics).

security:
  - {}
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /:
    get:
      tags: [core]
      summary: Serve the sandbox index document
      description: |
        Returns the `index.html` document from the configured `--directory` when it
        exists, streamed with a guessed `Content-Type` via chunked transfer encoding.
        When no index document is present, responds `200 OK` with an empty body.
      operationId: getIndex
      responses:
        "200":
          description: |
            The index document, or an empty body when no `index.html` is present.
          headers:
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
          content:
            text/html:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      tags: [core]
      summary: Index document headers without a body
      operationId: headIndex
      responses:
        "200":
          description: Same headers as `GET /`, with no message body.
          headers:
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /healthz:
    get:
      tags: [health]
      summary: Liveness and readiness probe
      description: |
        Public, never authenticated. Returns `200 OK` during normal operation and
        `503 Service Unavailable` (body `draining`, `Connection: close`) while the
        server is draining after receiving SIGTERM/SIGINT.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The server is healthy and accepting traffic. Empty body.
          headers:
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
        "503":
          description: The server is draining and not accepting new work.
          headers:
            Connection:
              $ref: "#/components/headers/Connection"
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
          content:
            text/plain:
              schema:
                type: string
                example: draining
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /echo/{message}:
    get:
      tags: [core]
      summary: Echo the path suffix as plain text
      description: |
        Reflects the path segment after `/echo/` back to the caller as `text/plain`.
        Compresses the body with gzip when the request advertises
        `Accept-Encoding: gzip` (q>0).
      operationId: getEcho
      parameters:
        - $ref: "#/components/parameters/MessagePath"
        - $ref: "#/components/parameters/AcceptEncoding"
      responses:
        "200":
          description: The echoed message.
          headers:
            Content-Encoding:
              $ref: "#/components/headers/ContentEncoding"
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
          content:
            text/plain:
              schema:
                type: string
                example: hello
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /user-agent:
    get:
      tags: [core]
      summary: Reflect the request User-Agent header
      description: |
        Returns the value of the request `User-Agent` header as `text/plain`
        (empty when the header is absent). Compresses with gzip when negotiated.
      operationId: getUserAgent
      parameters:
        - $ref: "#/components/parameters/UserAgent"
        - $ref: "#/components/parameters/AcceptEncoding"
      responses:
        "200":
          description: The reflected User-Agent value.
          headers:
            Content-Encoding:
              $ref: "#/components/headers/ContentEncoding"
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
          content:
            text/plain:
              schema:
                type: string
                example: curl/8.7.1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /files/{path}:
    parameters:
      - $ref: "#/components/parameters/FilePath"
    get:
      tags: [files]
      summary: Download a sandboxed file
      description: |
        Streams a file from the configured `--directory`. Full responses carry
        `Content-Length`, a strong-ish `ETag` (blake2b of size and mtime),
        `Last-Modified`, and `Accept-Ranges: bytes`. When `--file-cache-control` is set
        its value is returned as `Cache-Control`. When `--file-gzip` is enabled and the
        content type and size are eligible, the body is returned with
        `Content-Encoding: gzip`.

        Conditional and range semantics:
        - `Range: bytes=...` yields `206 Partial Content` with a `Content-Range` header,
          or `416 Range Not Satisfiable` (with `Content-Range: bytes */<size>`) when the
          range cannot be satisfied.
        - `If-None-Match` or `If-Modified-Since` that match the current validators yield
          `304 Not Modified`.

        When authentication is enabled this route additionally requires the
        `files:read` scope.
      operationId: getFile
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
        - $ref: "#/components/parameters/AcceptEncoding"
      responses:
        "200":
          $ref: "#/components/responses/FileContent"
        "206":
          $ref: "#/components/responses/FilePartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowedFiles"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      tags: [files]
      summary: File metadata headers without a body
      description: |
        Identical header semantics to `GET /files/{path}` (including conditional and
        range handling and the same status codes) but with no message body.
      operationId: headFile
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: File headers with no body.
          headers:
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
        "206":
          description: Partial content headers with no body.
          headers:
            Content-Range:
              $ref: "#/components/headers/ContentRange"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    post:
      tags: [files]
      summary: Create a sandboxed file
      description: |
        Writes the raw request body to `--directory/<path>`, creating parent directories
        as needed, and responds `201 Created`. A valid `Content-Length` matching the body
        length is mandatory: a missing or non-numeric value, a length that disagrees with
        the body, or a body larger than the configured maximum
        (`HTTP_SERVER_MAX_BODY_BYTES`, default 5 MiB) are rejected.

        When authentication is enabled this route additionally requires the
        `files:write` scope.
      operationId: createFile
      requestBody:
        required: true
        description: Raw bytes to persist at the target path.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          $ref: "#/components/responses/FileWritten"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowedFiles"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [files]
      summary: Create or overwrite a sandboxed file
      description: |
        Writes the raw request body to `--directory/<path>`. Responds `201 Created` when
        the target did not previously exist and `204 No Content` when it overwrites an
        existing file. Targeting an existing directory is rejected with `403 Forbidden`.
        When authentication is enabled a valid principal is required.
      operationId: putFile
      requestBody:
        required: true
        description: Raw bytes to persist at the target path.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          $ref: "#/components/responses/FileWritten"
        "204":
          $ref: "#/components/responses/FileOverwritten"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowedFiles"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [files]
      summary: Delete a sandboxed file
      description: |
        Removes `--directory/<path>`. Responds `204 No Content` on success and
        `404 Not Found` when the file does not exist. Targeting a directory is rejected
        with `403 Forbidden`. When authentication is enabled a valid principal is
        required.
      operationId: deleteFile
      responses:
        "204":
          $ref: "#/components/responses/FileDeleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowedFiles"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    options:
      tags: [files]
      summary: CORS preflight
      description: |
        When CORS is configured (`--cors-*` flags), an `OPTIONS` request carrying
        `Access-Control-Request-Method` is answered directly with `204 No Content` and
        the negotiated `Access-Control-*` headers, without invoking the file handler.
        Preflight is exempt from authentication. This behavior applies to every route,
        not only `/files/*`.
      operationId: preflightFile
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/AccessControlRequestMethod"
        - $ref: "#/components/parameters/AccessControlRequestHeaders"
      responses:
        "204":
          description: Preflight accepted.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AccessControlAllowOrigin"
            Access-Control-Allow-Methods:
              $ref: "#/components/headers/AccessControlAllowMethods"
            Access-Control-Allow-Headers:
              $ref: "#/components/headers/AccessControlAllowHeaders"
            Access-Control-Allow-Credentials:
              $ref: "#/components/headers/AccessControlAllowCredentials"
            Access-Control-Max-Age:
              $ref: "#/components/headers/AccessControlMaxAge"
            Vary:
              $ref: "#/components/headers/Vary"
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"

  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics exposition
      description: |
        Returns the Prometheus text exposition for request counters, the request-latency
        histogram, the in-flight gauge, the error counter, and the rejection counter.

        This route is **only registered when the server is started with `--metrics`**.
        Without it, requests to `/metrics` fall through to the not-found handler and
        return `404`. When authentication is enabled, `/metrics` is not public and
        requires a valid principal.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus 0.0.4 text exposition.
          headers:
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
              example: |
                # HELP http_requests_total Total HTTP requests.
                # TYPE http_requests_total counter
                http_requests_total{method="GET",route="/healthz",status="200"} 3
                # HELP http_request_errors_total Total HTTP request errors.
                # TYPE http_request_errors_total counter
                # HELP http_request_duration_seconds Request latency in seconds.
                # TYPE http_request_duration_seconds histogram
                # HELP http_in_flight_requests In-flight HTTP requests.
                # TYPE http_in_flight_requests gauge
                http_in_flight_requests 0
                # HELP http_rejections_total Total rejected connections.
                # TYPE http_rejections_total counter
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Metrics are disabled (server started without `--metrics`).
          headers:
            Strict-Transport-Security:
              $ref: "#/components/headers/StrictTransportSecurity"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Enabled with `--auth-mode api-key`. Send the credential as
        `Authorization: ApiKey <key>`. The server compares the SHA-256 hash of the
        presented key against configured credentials (`--auth-credentials`) and grants
        the scopes mapped to the matching identity (`--auth-roles`). On failure the
        server answers `401` with `WWW-Authenticate: ApiKey realm="pyhttpd"`.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Enabled with `--auth-mode jwt`. Send a `Authorization: Bearer <token>` HS256 JWT
        signed with `--jwt-secret`. The `exp` claim is required; `nbf`, `iss`
        (`--jwt-issuer`), and `aud` (`--jwt-audience`) are validated when configured. The
        `sub` claim becomes the principal identity and the `scope` claim (space-delimited
        string or array) supplies its scopes. On failure the server answers `401` with
        `WWW-Authenticate: Bearer realm="pyhttpd"`.

  parameters:
    MessagePath:
      name: message
      in: path
      required: true
      description: Arbitrary text reflected back in the response body.
      schema:
        type: string
      example: hello
    FilePath:
      name: path
      in: path
      required: true
      description: |
        Relative path under the configured `--directory`. Path traversal
        (`..`) and NUL bytes are rejected with `403 Forbidden`.
      schema:
        type: string
      example: notes/todo.txt
    AcceptEncoding:
      name: Accept-Encoding
      in: header
      required: false
      description: Advertise `gzip` (with q>0) to receive a gzip-compressed body.
      schema:
        type: string
      example: gzip
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: Client identifier reflected by `/user-agent`.
      schema:
        type: string
      example: curl/8.7.1
    Range:
      name: Range
      in: header
      required: false
      description: |
        Single byte range request, e.g. `bytes=0-1023`, `bytes=1024-`, or a suffix
        range `bytes=-512`. Multi-range requests are not supported and fall back to a
        full `200` response.
      schema:
        type: string
      example: bytes=0-1023
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Conditional ETag validator. When it matches the current `ETag` (or is `*`), the
        server responds `304 Not Modified`.
      schema:
        type: string
      example: '"0a1b2c3d4e5f60718293a4b5c6d7e8f9"'
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: |
        Conditional date validator (RFC 7231). When the file has not been modified after
        the supplied date, the server responds `304 Not Modified`. Ignored when
        `If-None-Match` is present.
      schema:
        type: string
      example: Wed, 24 Jun 2026 12:00:00 GMT
    Origin:
      name: Origin
      in: header
      required: false
      description: Request origin used for CORS negotiation.
      schema:
        type: string
      example: https://app.example.com
    AccessControlRequestMethod:
      name: Access-Control-Request-Method
      in: header
      required: false
      description: Method the client intends to use; presence marks a CORS preflight.
      schema:
        type: string
      example: PUT
    AccessControlRequestHeaders:
      name: Access-Control-Request-Headers
      in: header
      required: false
      description: Headers the client intends to send in the actual request.
      schema:
        type: string
      example: Content-Type, Authorization

  headers:
    StrictTransportSecurity:
      description: HSTS policy attached to every response.
      schema:
        type: string
        const: max-age=63072000; includeSubDomains
    ContentSecurityPolicy:
      description: CSP attached to every response.
      schema:
        type: string
        const: default-src 'self'
    XContentTypeOptions:
      description: MIME-sniffing protection attached to every response.
      schema:
        type: string
        const: nosniff
    Connection:
      description: Connection disposition.
      schema:
        type: string
        example: close
    ContentLength:
      description: Size of the (full or partial) representation in bytes.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 4096
    ContentEncoding:
      description: Present and set to `gzip` when the body was compressed.
      schema:
        type: string
        const: gzip
    ContentRange:
      description: |
        Byte extent of a `206` response (`bytes <start>-<end>/<size>`) or the valid
        extent advertised on a `416` response (`bytes */<size>`).
      schema:
        type: string
      example: bytes 0-1023/8192
    ETag:
      description: Strong-ish validator derived from file size and mtime.
      schema:
        type: string
      example: '"0a1b2c3d4e5f60718293a4b5c6d7e8f9"'
    LastModified:
      description: RFC 7231 GMT timestamp of the file's last modification.
      schema:
        type: string
      example: Wed, 24 Jun 2026 12:00:00 GMT
    AcceptRanges:
      description: Advertises byte-range support.
      schema:
        type: string
        const: bytes
    CacheControl:
      description: Present only when the server was started with `--file-cache-control`.
      schema:
        type: string
      example: public, max-age=3600
    WWWAuthenticate:
      description: Authentication challenge for the active auth mode.
      schema:
        type: string
      examples:
        apiKey:
          value: ApiKey realm="pyhttpd"
        bearer:
          value: Bearer realm="pyhttpd"
    Allow:
      description: Comma-separated list of methods supported by the resource.
      schema:
        type: string
      example: DELETE, GET, HEAD, POST, PUT
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema:
        type: integer
        minimum: 1
      example: 1
    RateLimitLimit:
      description: Configured request budget for the current window.
      schema:
        type: integer
      example: 100
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
        minimum: 0
      example: 0
    RateLimitReset:
      description: Seconds until the bucket refills.
      schema:
        type: string
      example: "1"
    Vary:
      description: Indicates response varies by the listed request headers.
      schema:
        type: string
      example: Origin
    AccessControlAllowOrigin:
      description: Allowed origin echoed for CORS-eligible requests.
      schema:
        type: string
      example: https://app.example.com
    AccessControlAllowMethods:
      description: Methods permitted for cross-origin requests (preflight only).
      schema:
        type: string
      example: GET, POST, PUT, DELETE
    AccessControlAllowHeaders:
      description: Request headers permitted for cross-origin requests (preflight only).
      schema:
        type: string
      example: Content-Type, Authorization
    AccessControlAllowCredentials:
      description: Present and `true` when credentialed CORS is enabled.
      schema:
        type: string
        const: "true"
    AccessControlExposeHeaders:
      description: Response headers exposed to the browser for simple requests.
      schema:
        type: string
      example: X-Request-ID
    AccessControlMaxAge:
      description: How long (seconds) a preflight result may be cached.
      schema:
        type: string
      example: "600"

  responses:
    FileContent:
      description: The full file content.
      headers:
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Content-Encoding:
          $ref: "#/components/headers/ContentEncoding"
        ETag:
          $ref: "#/components/headers/ETag"
        Last-Modified:
          $ref: "#/components/headers/LastModified"
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    FilePartialContent:
      description: |
        A single byte range of the file. The `Content-Type` reflects the file; the body
        contains only the requested bytes.
      headers:
        Content-Range:
          $ref: "#/components/headers/ContentRange"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        ETag:
          $ref: "#/components/headers/ETag"
        Last-Modified:
          $ref: "#/components/headers/LastModified"
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    NotModified:
      description: |
        The cached representation is still fresh. No body; only `ETag`, `Last-Modified`,
        `Cache-Control` (when configured), and the security headers are returned.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Last-Modified:
          $ref: "#/components/headers/LastModified"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    FileWritten:
      description: The file was created.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    FileOverwritten:
      description: An existing file was overwritten. Empty body.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    FileDeleted:
      description: The file was deleted. Empty body.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    BadRequest:
      description: |
        Malformed request: missing/invalid `Content-Length` on `POST`, a length that
        disagrees with the body, or a malformed request path.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    Unauthorized:
      description: |
        Authentication is enabled and the request lacks valid credentials. Returned only
        when `--auth-mode` is `api-key` or `jwt`.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    Forbidden:
      description: |
        The principal lacks the required scope (`files:read` for `GET`, `files:write` for
        `POST`), the path escapes the sandbox, or the target is a directory.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    NotFound:
      description: The requested resource does not exist.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    MethodNotAllowed:
      description: The HTTP method is not supported for this resource.
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    MethodNotAllowedFiles:
      description: |
        The HTTP method is not supported for `/files/*`. The `Allow` header enumerates
        `DELETE, GET, HEAD, POST, PUT`.
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    RangeNotSatisfiable:
      description: |
        The requested byte range cannot be satisfied. The `Content-Range` header
        advertises the valid extent as `bytes */<size>`.
      headers:
        Content-Range:
          $ref: "#/components/headers/ContentRange"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    PayloadTooLarge:
      description: |
        The request body exceeds the maximum accepted size
        (`HTTP_SERVER_MAX_BODY_BYTES`, default 5 MiB). The connection is closed.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    TooManyRequests:
      description: |
        The client exceeded the configured token-bucket rate limit. Returned only when
        rate limiting is enabled and not in dry-run mode.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
      content:
        text/plain:
          schema:
            type: string
            example: Rate limit exceeded
    InternalServerError:
      description: An unexpected server-side failure occurred.
      headers:
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
    ServiceUnavailable:
      description: |
        The server is draining (graceful shutdown) or a connection cap was exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        Connection:
          $ref: "#/components/headers/Connection"
        Strict-Transport-Security:
          $ref: "#/components/headers/StrictTransportSecurity"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
      content:
        text/plain:
          schema:
            type: string
            example: draining
