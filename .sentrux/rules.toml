[constraints]
min_quality = 0.64
min_modularity = 0.42
min_acyclicity = 1.0
min_depth = 0.41
min_equality = 0.64
min_redundancy = 0.97
max_cycles = 0
max_cc = 15
max_fn_lines = 100
max_file_lines = 500
max_upward_violations = 0
no_god_files = true

[[layers]]
name = "domain"
paths = ["src/pyhttpd/domain/**"]
order = 3

[[layers]]
name = "application"
paths = ["src/pyhttpd/application/**"]
order = 2

[[layers]]
name = "adapters"
paths = ["src/pyhttpd/adapters/**"]
order = 1

[[layers]]
name = "entrypoints"
paths = [
    "src/pyhttpd/composition.py",
    "src/pyhttpd/cli.py",
    "src/pyhttpd/__main__.py",
    "src/pyhttpd/__init__.py",
]
order = 0
